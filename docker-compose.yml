services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kedo
      POSTGRES_PASSWORD: kedo
      POSTGRES_DB: kedo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kedo -d kedo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
