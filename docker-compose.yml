x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  DATABASE_URL: postgres://kedo:kedo@postgres:5432/kedo?sslmode=disable
  JWT_SECRET: ${JWT_SECRET:-change-me-at-least-32-bytes-long}
  SEAL_SECRET: ${SEAL_SECRET:-change-me-another-32-bytes-secret}
  STORAGE_DIR: /data/files
  PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-8081}
  CORS_ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-8081}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kedo
      POSTGRES_PASSWORD: kedo
      POSTGRES_DB: kedo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kedo -d kedo"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      <<: *app-env
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/data/files
    restart: unless-stopped

  seed:
    build: ./backend
    entrypoint: ["/app/seed"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - files:/data/files
    restart: "no"

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      - api
      - seed
    restart: unless-stopped

volumes:
  pgdata:
  files:
